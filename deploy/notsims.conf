server {
    listen 127.0.0.1:4601;
    server_name _;
    root /var/www/notsims/current;
    # Preserve the standard JS/CSS/media map, then add WAV on this listener only.
    include /etc/nginx/mime.types;
    types { audio/wav wav; }
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    location = /notsims { return 308 /notsims/; }
    location /notsims/ { alias /var/www/notsims/current/; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
